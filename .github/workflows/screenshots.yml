# Takes the App Store's screenshots on GitHub's Macs and frames them for the listing, with `./build.sh screenshots`:
# the 6.9-inch iPhone's and the 13-inch iPad's, each on a runner of its own, kept with the run as "app-store <device>".
# Run it from the Actions tab, or with `gh workflow run screenshots.yml`.
name: Screenshots
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 17 Pro Max", "iPad Pro 13-inch (M5)"]
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: ./build.sh screenshots
        env:
          SIMULATOR: ${{ matrix.device }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: app-store ${{ matrix.device }}
          path: build/app-store
          if-no-files-found: ignore
      # The log says which test failed but not why: the results do, and their screen recording shows it.
      - name: Say why the test failed
        if: failure()
        run: |
          xcrun xcresulttool export attachments --path ".build/ios/$SIMULATOR.xcresult" --output-path failure
          xcrun xcresulttool get test-results summary --path ".build/ios/$SIMULATOR.xcresult" --compact | jq -r '.testFailures[]? | "\(.testName): \(.failureText)"'
        env:
          SIMULATOR: ${{ matrix.device }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: failure ${{ matrix.device }}
          path: failure
          if-no-files-found: ignore
